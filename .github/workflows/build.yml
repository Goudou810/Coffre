           }
           $("go").disabled=true;$("go").textContent="…";
           setTimeout(()=>{
            if(mode=="create"){if(A.create(p,JSON.stringify({e:[]}))===true){E=[];enter()}else{err("Création impossible");idle()}return}
            const r=A.unlock(p);
            let ok=typeof r==="string"&&r.slice(0,2)==="OK";
            if(ok){try{E=JSON.parse(r.slice(2)).e||[]}catch(x){ok=false}}
            if(!ok){fails++;until=Date.now()+Math.min(fails*2,30)*1000;err("Code incorrect");const b=$("box");b.classList.remove("sh");void b.offsetWidth;b.classList.add("sh");idle();return}
            fails=0;$("pin").value="";enter();
           },60);
          };
          function tab(i){[0,1,2].forEach(k=>{$("v"+k).classList.toggle("on",k==i);$("n"+k).classList.toggle("on",k==i)});if(i==1&&!$("out").textContent)$("out").textContent=gen();if(i==2)bk()}
          $("n0").onclick=()=>tab(0);$("n1").onclick=()=>tab(1);$("n2").onclick=()=>tab(2);$("lk").onclick=lockUI;
          function list(){
           const q=$("q").value.toLowerCase(),L=$("list");L.innerHTML="";
           const f=E.filter(x=>(x.t+" "+x.u).toLowerCase().includes(q)).sort((a,b)=>a.t.localeCompare(b.t));
           if(!f.length){const p=document.createElement("p");p.className="empty";p.textContent=E.length?"Aucun résultat":"Ton coffre est vide. Touche + pour ajouter un mot de passe ou une note.";L.append(p)}
           f.forEach(x=>{
            const b=document.createElement("button"),d=document.createElement("div"),s=document.createElement("span"),m=document.createElement("small");
            b.className="it";d.className="bd";d.textContent=(x.t[0]||"?").toUpperCase();
            s.textContent=x.t;m.textContent=x.u||(x.p?"Mot de passe":"Note");s.append(m);
            b.append(d,s);b.onclick=()=>edit(x);L.append(b);
           });
          }
          $("q").oninput=list;
          function edit(x){cur=x||null;$("sh_t").textContent=x?"Modifier":"Nouvelle entrée";$("f_t").value=x?x.t:"";$("f_u").value=x?x.u:"";$("f_p").value=x?x.p:"";$("f_p").type="password";$("sp").textContent="Voir";$("f_n").value=x?x.n:"";$("dl").style.display=x?"block":"none";$("sheet").classList.add("on")}
          $("add").onclick=()=>edit();
          $("cl").onclick=()=>$("sheet").classList.remove("on");
          function persist(){if(!A.save(JSON.stringify({e:E})))toast("Échec de l'enregistrement")}
          $("sv").onclick=()=>{
           const o={t:$("f_t").value.trim(),u:$("f_u").value.trim(),p:$("f_p").value,n:$("f_n").value};
           if(!o.t){toast("Donne un titre");return}
           if(cur)Object.assign(cur,o);else E.push(Object.assign({id:Date.now()},o));
           persist();$("sheet").classList.remove("on");list();
          };
          $("dl").onclick=()=>{
           if(del){del=0;E=E.filter(x=>x!==cur);persist();$("sheet").classList.remove("on");list();$("dl").textContent="Supprimer";return}
           del=1;$("dl").textContent="Confirmer la suppression";setTimeout(()=>{del=0;$("dl").textContent="Supprimer"},3000);
          };
          $("sp").onclick=()=>{const p=$("f_p");p.type=p.type=="password"?"text":"password";$("sp").textContent=p.type=="password"?"Voir":"Cacher"};
          $("cu").onclick=()=>{A.copy($("f_u").value);toast("Identifiant copié")};
          $("cp").onclick=()=>{A.copy($("f_p").value);toast("Mot de passe copié")};
          $("gp").onclick=()=>{$("f_p").value=gen();$("f_p").type="text";$("sp").textContent="Cacher"};
          function gen(){
           const n=+$("len").value,u=$("up").checked,d=$("dg").checked,y=$("sy").checked;
           let s="abcdefghijkmnopqrstuvwxyz";if(u)s+="ABCDEFGHJKLMNPQRSTUVWXYZ";if(d)s+="23456789";if(y)s+="!@#$%&*?-_+=";
           const lim=Math.floor(4294967296/s.length)*s.length,b=new Uint32Array(1);let o;
           do{o=[];while(o.length<n){crypto.getRandomValues(b);if(b[0]<lim)o.push(s[b[0]%s.length])}o=o.join("")}
           while((u&&!/[A-Z]/.test(o))||(d&&!/[2-9]/.test(o))||(y&&!/[^a-zA-Z0-9]/.test(o)));
           return o;
          }
          $("gn").onclick=()=>$("out").textContent=gen();
          $("co").onclick=()=>{A.copy($("out").textContent);toast("Copié")};
          $("len").oninput=()=>{$("ln").textContent=$("len").value;$("out").textContent=gen()};
          ["up","dg","sy"].forEach(i=>$(i).onchange=()=>$("out").textContent=gen());
          function back(){if($("lock").style.display=="flex")return false;if($("sheet").classList.contains("on")){$("sheet").classList.remove("on");return true}if(!$("n0").classList.contains("on")){tab(0);return true}return false}
          function bk(){
           if(!A)return;
           let i={};try{i=JSON.parse(A.info())}catch(x){}
           $("dv").textContent=i.d||"inconnu";
           $("bs").textContent=i.f?"Dossier : "+i.f+(i.t?"\nDernière sauvegarde : "+new Date(i.t).toLocaleString("fr-FR"):"\nPas encore de sauvegarde"):"Désactivée : choisis un dossier pour l'activer.";
          }
          $("bf").onclick=()=>A.pickFolder();
          $("bn").onclick=()=>{toast(A.backupNow()===true?"Sauvegarde faite":"Choisis d'abord un dossier");bk()};
          $("rs").onclick=()=>A.restore();
          showLock();
          </script>
          </body>
          </html>
          EOF_6
