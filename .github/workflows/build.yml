           let i={};try{i=JSON.parse(A.sinfo())}catch(x){}
           const on=!!i.e;
           $("al").style.display=on?"none":"block";$("ao").style.display=on?"block":"none";
           const S={ok:"À jour",conflit:"Conflit : un autre appareil a modifié le coffre",off:"Hors ligne : renvoi à la prochaine modification"};
           $("as").textContent=on?"Connecté : "+i.e+"\n"+(S[i.st]||"")+(i.ok?"\nDernière synchro : "+new Date(i.ok).toLocaleString("fr-FR"):""):"Non connecté. Un compte permet de retrouver ton coffre sur un autre téléphone.";
          }
          function two(id,txt,fn){const b=$(id);let a=0;b.onclick=()=>{if(a){a=0;b.textContent=txt;fn();return}a=1;b.textContent="Confirmer ?";setTimeout(()=>{a=0;b.textContent=txt},3000)}}
          $("ra").onclick=()=>{sctx="lock";astep()};
          $("au").onclick=()=>{sctx="set";const e=$("ae").value.trim(),p=$("ap").value;if(!e||p.length<8){toast("E-mail et mot de passe (8 caractères min.)");return}toast("Création…");A.acct("up",e,p)};
          $("ai").onclick=()=>{sctx="set";const e=$("ae").value.trim(),p=$("ap").value;if(!e||!p){toast("E-mail et mot de passe");return}toast("Connexion…");A.acct("in",e,p)};
          $("sy2").onclick=()=>{sctx="set";toast("Synchronisation…");A.push(false)};
          two("pf","Écraser le compte avec ce coffre",()=>{sctx="set";A.push(true)});
          two("pl","Remplacer ce coffre par celui du compte",()=>{sctx="set";A.pull(true)});
          $("lo").onclick=()=>{A.logout();ac();toast("Déconnecté")};
          showLock();
          </script>
          </body>
          </html>
          EOF_7
