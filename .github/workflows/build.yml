            if(p!==$("pw2").value){err("errA","Les deux mots de passe sont différents");return}
            EM=e;P=p;ctx="up";err("errQ");scr("sQ");return;
           }
           if(!p){err("errA","Entre ton mot de passe");return}
           EM=e;P=p;ctx="in";err("errA");busy("goA",true);A.acct("in",e,p);
          };
          $("goQ").onclick=()=>{
           const q=$("qq").value.trim(),a=$("qa").value;
           if(q.length<5||a.trim().length<2){err("errQ","Question (5 caractères min.) et réponse requises");return}
           Q=q;AN=a;err("errQ");busy("goQ",true);
           if(ctx=="up")A.acct("up",EM,P);else finishCreate();
          };
          $("bkQ").onclick=()=>scr("sAuth");
          function finishCreate(){
           setTimeout(()=>{
            if(A.setup(P,Q,AN)!==true){busy("goQ",false);err("errQ","Création impossible, réessaie");return}
            E=[];P="";AN="";Q="";busy("goQ",false);enter();
            if(ctx=="up")setTimeout(()=>{try{toast(JSON.parse(A.sinfo()).vs?"Compte créé : e-mail de vérification envoyé, regarde ta boîte et tes spams":"Compte créé")}catch(x){}},1200);
           },60);
          }
          function sdone(op,r){
           const bad=r.startsWith("ERR"),m=bad?r.slice(4):"";
           if(op=="acct"){
            if(bad){busy("goA",false);busy("goQ",false);if(ctx=="in")err("errA",m);else if(ctx=="up")err("errQ",m);else toast(m);return}
            if(ctx=="in")A.pull(false);else if(ctx=="up")finishCreate();else A.push(false);
            return;
           }
           if(op=="pull"){
            if(ctx=="in"){
             busy("goA",false);
             if(r=="OK"){Q=A.question();if(!Q){err("errA","Coffre en ligne illisible");return}uStep(2);return}
             if(r=="EMPTY"){err("errQ");scr("sQ");return}
             err("errA",m);return;
            }
            if(r=="OK"){lockUI();toast("Coffre remplacé : déverrouille-le");return}
            toast(r=="EMPTY"?"Aucun coffre dans le compte":m);return;
           }
           if(op=="vstat"){const v=$("vf");if(r=="1"){v.textContent="E-mail vérifié";v.style.color="var(--ok)";$("rv").style.display="none"}else if(r=="0"){v.textContent="E-mail non vérifié : ouvre le lien reçu par e-mail";v.style.color="var(--wn)";$("rv").style.display="block"}else{v.textContent="";$("rv").style.display="none"}return}
           if(op=="resend"){toast(r=="OK"?"E-mail de vérification envoyé":m);return}
           toast(r=="OK"?"Synchronisé":r=="CONFLICT"?"Conflit : récupère ou écrase":m);pill();acv();
          }
          function tab(i){[0,1].forEach(k=>{$("v"+k).classList.toggle("on",k==i);$("n"+k).classList.toggle("on",k==i)});if(i==1)acv()}
          $("n0").onclick=()=>tab(0);$("n1").onclick=()=>tab(1);$("lk").onclick=lockUI;$("lk2").onclick=lockUI;$("pill").onclick=()=>tab(1);
          function pill(){
           if(!A||$("app").style.display!="flex")return;
           let i={};try{i=JSON.parse(A.sinfo())}catch(x){}
           const p=$("pill");
           if(!i.e){p.className="pill";p.innerHTML='<span class="dot"></span>Non lié';return}
           const m={ok:["ok","Synchronisé"],conflit:["wn","Conflit"],err:["wn","Erreur"],off:["","Hors ligne"]}[i.st]||["","En attente"];
           p.className="pill "+m[0];p.innerHTML='<span class="dot"></span>'+m[1];
          }
          setInterval(pill,3000);
          function acv(){
           let i={};try{i=JSON.parse(A.sinfo())}catch(x){}
           const on=!!i.e;
           $("pe").textContent=on?i.e:"Non connecté";$("pav").textContent=on?i.e[0].toUpperCase():"?";$("pav").style.background=on?colr(i.e):"#243752";
           const S={ok:"Synchronisé",conflit:"Conflit : un autre appareil a modifié le coffre",err:"Erreur de synchronisation",off:"Hors ligne : renvoi à la prochaine modification"};
           $("ps").textContent=on?(S[i.st]||"En attente de synchronisation")+(i.ok?" - "+new Date(i.ok).toLocaleString("fr-FR"):"")+(i.st&&i.st!="ok"&&i.le?"\nDétail : "+i.le:""):"Aucun compte relié";
           $("al").style.display=on?"none":"block";$("ao").style.display=on?"block":"none";
           if(on)A.vstat();else{$("vf").textContent="";$("rv").style.display="none"}
          }
          function two(id,txt,fn){const b=$(id);let a=0;b.onclick=()=>{if(a){a=0;b.textContent=txt;fn();return}a=1;b.textContent="Confirmer ?";setTimeout(()=>{a=0;b.textContent=txt},3000)}}
          function linkAcct(m){const e=$("le").value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){toast("Adresse e-mail invalide");return}ctx="set";toast(m=="up"?"Création du compte…":"Connexion…");A.acct2(m,e)}
          $("lu").onclick=()=>linkAcct("up");$("li").onclick=()=>linkAcct("in");$("rv").onclick=()=>{toast("Envoi…");A.resend()};
          $("sy2").onclick=()=>{ctx="set";toast("Synchronisation…");A.push(false)};
          two("pf","Écraser le compte avec ce coffre",()=>{ctx="set";A.push(true)});
          two("pl","Remplacer ce coffre par celui du compte",()=>{ctx="set";A.pull(true)});
          two("lo","Se déconnecter",()=>{const r=A.logout();if(r==="OK"){lockUI();toast("Déconnecté")}else toast(r.slice(4))});
          document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>{flt=b.dataset.f;document.querySelectorAll("#chips button").forEach(x=>x.classList.toggle("on",x==b));list()});
          function list(){
           const q=$("q").value.toLowerCase(),L=$("list");L.innerHTML="";
           let f=E.filter(x=>(x.t+" "+x.u).toLowerCase().includes(q));
           if(flt=="pw")f=f.filter(x=>x.p);if(flt=="note")f=f.filter(x=>!x.p);
           f.sort((a,b)=>a.t.localeCompare(b.t));
           if(!f.length){
            const d=el("div","empty",ic("vault",44)+"<p>"+(E.length?"Aucun résultat":"Ton coffre est vide.<br>Touche + pour ajouter ton premier mot de passe ou une note.")+"</p>");L.append(d);return;
           }
           f.forEach((x,i)=>{
            const b=el("div","it"),av=el("div","av",(x.t[0]||"?").toUpperCase()),tx=el("div","tx"),t=el("b"),s=el("small");
            b.style.animationDelay=Math.min(i*30,300)+"ms";av.style.background=colr(x.t);
            t.textContent=x.t;s.textContent=x.u||(x.p?"Mot de passe":"Note sécurisée");tx.append(t,s);b.append(av,tx);
            if(x.p){const c=el("button","eye",ic("copy"));c.setAttribute("aria-label","Copier le mot de passe");c.onclick=ev=>{ev.stopPropagation();A.copy(x.p);toast("Mot de passe copié")};b.append(c)}
            b.onclick=()=>edit(x);L.append(b);
           });
          }
          $("q").oninput=list;
          function updAv(){const t=$("f_t").value.trim();$("sh_av").textContent=(t[0]||"?").toUpperCase();$("sh_av").style.background=colr(t||"?")}
          $("f_t").oninput=updAv;
          function edit(x){cur=x||null;$("sh_t").textContent=x?"Modifier":"Nouvelle entrée";$("f_t").value=x?x.t:"";$("f_u").value=x?x.u:"";$("f_p").value=x?x.p:"";$("f_p").type="password";$("sp").innerHTML=ic("eye");$("f_n").value=x?x.n:"";$("dl").style.display=x?"block":"none";updAv();$("sheet").classList.add("on")}
          function closeSheet(){$("sheet").classList.remove("on")}
          $("add").onclick=()=>edit();$("cl").onclick=closeSheet;
          function persist(){if(!A.save(JSON.stringify({e:E})))toast("Échec de l'enregistrement");setTimeout(pill,1500)}
          $("sv").onclick=()=>{
           const o={t:$("f_t").value.trim(),u:$("f_u").value.trim(),p:$("f_p").value,n:$("f_n").value};
           if(!o.t){toast("Donne un titre");return}
           if(cur)Object.assign(cur,o);else E.push(Object.assign({id:Date.now()},o));
           persist();closeSheet();list();toast("Enregistré");
          };
          two("dl","Supprimer",()=>{E=E.filter(x=>x!==cur);persist();closeSheet();list()});
          $("sp").onclick=()=>{const p=$("f_p");p.type=p.type=="password"?"text":"password";$("sp").innerHTML=ic(p.type=="password"?"eye":"eyeoff")};
          $("cu").onclick=()=>{A.copy($("f_u").value);toast("Identifiant copié")};
          $("cp").onclick=()=>{A.copy($("f_p").value);toast("Mot de passe copié")};
          function gen(){
           const n=18;let s="abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*?-_+=";
           const lim=Math.floor(4294967296/s.length)*s.length,b=new Uint32Array(1);let o;
           do{o=[];while(o.length<n){crypto.getRandomValues(b);if(b[0]<lim)o.push(s[b[0]%s.length])}o=o.join("")}
           while(!/[a-z]/.test(o)||!/[A-Z]/.test(o)||!/[2-9]/.test(o)||!/[^a-zA-Z0-9]/.test(o));
           return o;
          }
          $("gp").onclick=()=>{$("f_p").value=gen();$("f_p").type="text";$("sp").innerHTML=ic("eyeoff")};
          function back(){
           if($("lock").style.display=="flex"){if($("sQ").style.display=="block"){scr("sAuth");return true}return false}
           if($("sheet").classList.contains("on")){closeSheet();return true}
           if(!$("n0").classList.contains("on")){tab(0);return true}
           return false;
          }
          showLock();
          </script>
          </body>
          </html>
