                  SharedPreferences s = p(c);
                  try {
                      String e = s.getString("at", null) == null ? "" : s.getString("em", "");
                      return new JSONObject().put("e", e).put("ok", s.getLong("ok", 0)).put("st", s.getString("st", "")).toString();
