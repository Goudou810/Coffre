name: Construire le Coffre
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Cle de signature
        run: |
          if [ ! -f coffre.keystore ]; then
            keytool -genkeypair -keystore coffre.keystore -storepass coffre-ks-2026 -keypass coffre-ks-2026 -alias coffre -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Coffre"
            git config user.name bot
            git config user.email bot@users.noreply.github.com
            git add coffre.keystore
            git commit -m "Cle de signature"
            git push
          fi
      - name: Ecrire le projet
        run: |
          mkdir -p app/src/main/java/com/coffre/app app/src/main/assets app/src/main/res/drawable app/src/main/res/mipmap-anydpi
          cat > settings.gradle <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Coffre'
          include ':app'
          EOF_0
          cat > app/build.gradle <<'EOF_1'
          plugins { id 'com.android.application' version '8.5.2' }

          android {
              namespace 'com.coffre.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.coffre.app'
                  minSdk 26
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
                  versionName '1.1'
              }
              signingConfigs {
                  main {
                      storeFile file("$rootDir/coffre.keystore")
                      storePassword 'coffre-ks-2026'
                      keyAlias 'coffre'
                      keyPassword 'coffre-ks-2026'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.main }
              }
          }
          EOF_1
          cat > app/src/main/AndroidManifest.xml <<'EOF_2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Coffre"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_2
          cat > app/src/main/java/com/coffre/app/MainActivity.java <<'EOF_3'
          package com.coffre.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PersistableBundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.security.SecureRandom;

          public class MainActivity extends Activity {
              WebView w;
              Handler h = new Handler(Looper.getMainLooper());
              boolean busy = false;

              public class Bridge {
                  @JavascriptInterface
                  public boolean has() {
                      return Vault.file(MainActivity.this).exists();
                  }

                  @JavascriptInterface
                  public boolean create(String pin, String json) {
                      try {
                          if (Vault.file(MainActivity.this).exists()) return false;
                          byte[] s = new byte[16];
                          new SecureRandom().nextBytes(s);
                          Vault.salt = s;
                          Vault.key = Vault.derive(pin, s);
                          Vault.write(MainActivity.this, json);
                          Backup.run(MainActivity.this);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public String unlock(String pin) {
                      try {
                          return "OK" + Vault.open(MainActivity.this, pin);
                      } catch (Exception e) {
                          return "ERR";
                      }
                  }

                  @JavascriptInterface
                  public boolean save(String json) {
                      try {
                          if (Vault.key == null) return false;
                          Vault.write(MainActivity.this, json);
                          Backup.run(MainActivity.this);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void lock() {
                      Vault.key = null;
                  }

                  @JavascriptInterface
                  public String info() {
                      return Backup.info(MainActivity.this);
                  }

                  @JavascriptInterface
                  public boolean backupNow() {
                      return Backup.run(MainActivity.this);
                  }

                  @JavascriptInterface
                  public void pickFolder() {
                      runOnUiThread(() -> {
                          busy = true;
                          Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                          i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                  | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                          startActivityForResult(i, 1);
                      });
                  }

                  @JavascriptInterface
                  public void restore() {
                      runOnUiThread(() -> {
                          busy = true;
                          Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          startActivityForResult(i, 2);
                      });
                  }

                  @JavascriptInterface
                  public void copy(final String t) {
                      runOnUiThread(() -> {
                          final ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          ClipData d = ClipData.newPlainText("v", t);
                          if (Build.VERSION.SDK_INT >= 33) {
                              PersistableBundle pb = new PersistableBundle();
                              pb.putBoolean("android.content.extra.IS_SENSITIVE", true);
                              d.getDescription().setExtras(pb);
                          }
                          cm.setPrimaryClip(d);
                          h.removeCallbacksAndMessages(null);
                          h.postDelayed(() -> {
                              if (Build.VERSION.SDK_INT >= 28) cm.clearPrimaryClip();
                              else cm.setPrimaryClip(ClipData.newPlainText("", ""));
                          }, 30000);
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
                  w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS);
                  w.setBackgroundColor(0xFF0E1620);
                  w.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int rq, int rs, Intent d) {
                  super.onActivityResult(rq, rs, d);
                  busy = false;
                  if (rs != RESULT_OK || d == null || d.getData() == null) return;
                  final Uri u = d.getData();
                  try {
                      if (rq == 1) {
                          getContentResolver().takePersistableUriPermission(u,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                          Backup.p(this).edit().putString("tree", u.toString()).remove("doc").apply();
                          new Thread(() -> {
                              Backup.run(MainActivity.this);
                              runOnUiThread(() -> w.evaluateJavascript("bk()", null));
                          }).start();
                      } else if (rq == 2) {
                          InputStream in = getContentResolver().openInputStream(u);
                          ByteArrayOutputStream o = new ByteArrayOutputStream();
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
                          in.close();
                          byte[] b = o.toByteArray();
                          if (b.length < 29 || Vault.file(this).exists()) throw new Exception("bad");
                          File tmp = new File(getFilesDir(), "vault.tmp");
                          FileOutputStream fo = new FileOutputStream(tmp);
                          fo.write(b);
                          fo.close();
                          tmp.renameTo(Vault.file(this));
                          w.evaluateJavascript("showLock();toast('Sauvegarde restaurée : entre ton code')", null);
                      }
                  } catch (Exception e) {
                      w.evaluateJavascript("toast('Échec')", null);
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (!busy) {
                      Vault.key = null;
                      w.evaluateJavascript("lockUI()", null);
                  }
              }

              @Override
              public void onBackPressed() {
                  w.evaluateJavascript("back()", v -> {
                      if (!"true".equals(v)) finish();
                  });
              }
          }
          EOF_3
          cat > app/src/main/java/com/coffre/app/Vault.java <<'EOF_4'
          package com.coffre.app;

          import android.content.Context;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.file.Files;
          import java.security.SecureRandom;
          import java.util.Arrays;
          import javax.crypto.Cipher;
          import javax.crypto.SecretKeyFactory;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.crypto.spec.PBEKeySpec;
          import javax.crypto.spec.SecretKeySpec;

          public class Vault {
              static SecretKeySpec key;
              static byte[] salt;

              static File file(Context c) {
                  return new File(c.getFilesDir(), "vault.bin");
              }

              static SecretKeySpec derive(String pin, byte[] s) throws Exception {
                  SecretKeyFactory f = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256");
                  byte[] k = f.generateSecret(new PBEKeySpec(pin.toCharArray(), s, 310000, 256)).getEncoded();
                  return new SecretKeySpec(k, "AES");
              }

              static void write(Context c, String json) throws Exception {
                  byte[] iv = new byte[12];
                  new SecureRandom().nextBytes(iv);
                  Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                  ci.init(Cipher.ENCRYPT_MODE, key, new GCMParameterSpec(128, iv));
                  byte[] ct = ci.doFinal(json.getBytes("UTF-8"));
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  o.write(salt);
                  o.write(iv);
                  o.write(ct);
                  File tmp = new File(c.getFilesDir(), "vault.tmp");
                  FileOutputStream fo = new FileOutputStream(tmp);
                  fo.write(o.toByteArray());
                  fo.getFD().sync();
                  fo.close();
                  if (!tmp.renameTo(file(c))) throw new Exception("rename");
              }

              static String open(Context c, String pin) throws Exception {
                  byte[] b = Files.readAllBytes(file(c).toPath());
                  byte[] s = Arrays.copyOfRange(b, 0, 16);
                  byte[] iv = Arrays.copyOfRange(b, 16, 28);
                  byte[] ct = Arrays.copyOfRange(b, 28, b.length);
                  SecretKeySpec k = derive(pin, s);
                  Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                  ci.init(Cipher.DECRYPT_MODE, k, new GCMParameterSpec(128, iv));
                  String json = new String(ci.doFinal(ct), "UTF-8");
                  key = k;
                  salt = s;
                  return json;
              }
          }
          EOF_4
          cat > app/src/main/java/com/coffre/app/Backup.java <<'EOF_5'
          package com.coffre.app;

          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.DocumentsContract;
          import java.io.OutputStream;
          import java.nio.file.Files;

          public class Backup {
              static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("b", 0);
              }

              static String dev() {
                  return (Build.MANUFACTURER + " " + Build.MODEL).trim();
              }

              static String fname() {
                  return "coffre-" + dev().replaceAll("[^A-Za-z0-9]+", "-") + ".bin";
              }

              static String info(Context c) {
                  SharedPreferences s = p(c);
                  String t = s.getString("tree", null);
                  String f = "";
                  if (t != null) {
                      String seg = Uri.parse(t).getLastPathSegment();
                      if (seg != null) f = seg;
                  }
                  return "{\"d\":\"" + dev().replace("\"", "") + "\",\"f\":\"" + f.replace("\\", "").replace("\"", "")
                          + "\",\"t\":" + s.getLong("t", 0) + "}";
              }

              static boolean run(Context c) {
                  try {
                      String t = p(c).getString("tree", null);
                      if (t == null) return false;
                      Uri tree = Uri.parse(t);
                      ContentResolver r = c.getContentResolver();
                      byte[] b = Files.readAllBytes(Vault.file(c).toPath());
                      OutputStream o = null;
                      String d = p(c).getString("doc", null);
                      if (d != null) {
                          try {
                              o = r.openOutputStream(Uri.parse(d), "wt");
                          } catch (Exception e) {
                              o = null;
                          }
                      }
                      if (o == null) {
                          Uri parent = DocumentsContract.buildDocumentUriUsingTree(tree, DocumentsContract.getTreeDocumentId(tree));
                          Uri doc = DocumentsContract.createDocument(r, parent, "application/octet-stream", fname());
                          if (doc == null) return false;
                          p(c).edit().putString("doc", doc.toString()).apply();
                          o = r.openOutputStream(doc, "wt");
                      }
                      o.write(b);
                      o.close();
                      p(c).edit().putLong("t", System.currentTimeMillis()).apply();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
