name: Construire le Coffre
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Cle de signature
        run: |
          if [ ! -f coffre.keystore ]; then
            keytool -genkeypair -keystore coffre.keystore -storepass coffre-ks-2026 -keypass coffre-ks-2026 -alias coffre -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Coffre"
            git config user.name bot
            git config user.email bot@users.noreply.github.com
            git add coffre.keystore
            git commit -m "Cle de signature"
            git push
          fi
      - name: Ecrire le projet
        run: |
          mkdir -p app/src/main/java/com/coffre/app app/src/main/assets app/src/main/res/drawable app/src/main/res/mipmap-anydpi
          cat > settings.gradle <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Coffre'
          include ':app'
          EOF_0
          cat > app/build.gradle <<'EOF_1'
          plugins { id 'com.android.application' version '8.5.2' }

          android {
              namespace 'com.coffre.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.coffre.app'
                  minSdk 30
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
                  versionName '1.3'
              }
              signingConfigs {
                  main {
                      storeFile file("$rootDir/coffre.keystore")
                      storePassword 'coffre-ks-2026'
                      keyAlias 'coffre'
                      keyPassword 'coffre-ks-2026'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.main }
              }
          }
          EOF_1
          cat > app/src/main/AndroidManifest.xml <<'EOF_2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Coffre"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_2
          cat > app/src/main/java/com/coffre/app/MainActivity.java <<'EOF_3'
          package com.coffre.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.hardware.biometrics.BiometricManager;
          import android.hardware.biometrics.BiometricPrompt;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PersistableBundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.security.SecureRandom;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              WebView w;
              Handler h = new Handler(Looper.getMainLooper());
              boolean busy = false;

              void js(final String s) {
                  runOnUiThread(() -> w.evaluateJavascript(s, null));
              }

              void startBio(final int step) {
                  BiometricPrompt.Builder b = new BiometricPrompt.Builder(this)
                          .setTitle(step == 3 ? "Étape 3 : visage" : "Étape 4 : empreinte")
                          .setAllowedAuthenticators(step == 3 ? BiometricManager.Authenticators.BIOMETRIC_WEAK
                                  : BiometricManager.Authenticators.BIOMETRIC_STRONG)
                          .setNegativeButton("Annuler", getMainExecutor(), (d, i) -> js("bioDone(" + step + ",false)"));
                  b.build().authenticate(new CancellationSignal(), getMainExecutor(), new BiometricPrompt.AuthenticationCallback() {
                      @Override
                      public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult r) {
                          if (step == 4) Vault.gate = true;
                          js("bioDone(" + step + ",true)");
                      }

                      @Override
                      public void onAuthenticationError(int code, CharSequence m) {
                          js("bioDone(" + step + ",false)");
                      }
                  });
              }

              public class Bridge {
                  @JavascriptInterface
                  public boolean has() {
                      return Vault.file(MainActivity.this).exists();
                  }

                  @JavascriptInterface
                  public String question() {
                      return Vault.question(MainActivity.this);
                  }

                  @JavascriptInterface
                  public String caps() {
                      BiometricManager bm = getSystemService(BiometricManager.class);
                      boolean strong = bm.canAuthenticate(BiometricManager.Authenticators.BIOMETRIC_STRONG)
                              == BiometricManager.BIOMETRIC_SUCCESS;
                      boolean face = getPackageManager().hasSystemFeature(PackageManager.FEATURE_FACE)
                              && bm.canAuthenticate(BiometricManager.Authenticators.BIOMETRIC_WEAK)
                              == BiometricManager.BIOMETRIC_SUCCESS;
                      return (face ? "1" : "0") + (strong ? "1" : "0");
                  }

                  @JavascriptInterface
                  public void bio(final int step) {
                      runOnUiThread(() -> startBio(step));
                  }

                  @JavascriptInterface
                  public String unlock(String pin, String ans) {
                      try {
                          Vault.lock();
                          Vault.open(MainActivity.this, pin, ans);
                          return Vault.legacy ? "LEG" : "OK";
                      } catch (Exception e) {
                          Vault.lock();
                          return "ERR";
                      }
                  }

                  @JavascriptInterface
                  public String data() {
                      return Vault.gate && Vault.json != null ? Vault.json : "ERR";
                  }

                  @JavascriptInterface
                  public boolean setup(String pin, String q, String ans) {
                      try {
                          if (!Vault.gate) return false;
                          boolean exists = Vault.file(MainActivity.this).exists();
                          if (exists && !Vault.legacy) return false;
                          String j = exists ? Vault.json : "{\"e\":[]}";
                          byte[] s = new byte[16];
                          new SecureRandom().nextBytes(s);
                          Vault.salt = s;
                          Vault.q = q;
                          Vault.json = j;
                          Vault.key = Vault.derive(pin, ans, s);
                          Vault.write(MainActivity.this);
                          Vault.legacy = false;
                          Backup.run(MainActivity.this);
                          Sync.auto(MainActivity.this);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean save(String j) {
                      try {
                          if (Vault.key == null || !Vault.gate || Vault.legacy) return false;
                          Vault.json = j;
                          Vault.write(MainActivity.this);
                          Backup.run(MainActivity.this);
                          Sync.auto(MainActivity.this);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void lock() {
                      Vault.lock();
                  }

                  @JavascriptInterface
                  public String info() {
                      return Backup.info(MainActivity.this);
                  }

                  @JavascriptInterface
                  public boolean backupNow() {
                      return Backup.run(MainActivity.this);
                  }

                  @JavascriptInterface
                  public void pickFile() {
                      runOnUiThread(() -> {
                          busy = true;
                          Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("application/octet-stream");
                          i.putExtra(Intent.EXTRA_TITLE, Backup.fname());
                          i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                  | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                          startActivityForResult(i, 1);
                      });
                  }

                  @JavascriptInterface
                  public void restore() {
                      runOnUiThread(() -> {
                          busy = true;
                          Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          startActivityForResult(i, 2);
                      });
                  }

                  @JavascriptInterface
                  public void acct(final String mode, final String email, final String pw) {
                      new Thread(() -> js("sdone('acct'," + JSONObject.quote(Sync.login(MainActivity.this, mode, email.trim(), pw)) + ")")).start();
                  }

                  @JavascriptInterface
                  public void push(final boolean force) {
                      new Thread(() -> js("sdone('push'," + JSONObject.quote(Sync.push(MainActivity.this, force)) + ")")).start();
                  }

                  @JavascriptInterface
                  public void pull(final boolean force) {
                      new Thread(() -> js("sdone('pull'," + JSONObject.quote(Sync.pull(MainActivity.this, force)) + ")")).start();
                  }

                  @JavascriptInterface
                  public void logout() {
                      Sync.p(MainActivity.this).edit().clear().apply();
                  }

                  @JavascriptInterface
                  public boolean cfg() {
                      return !Sync.SB_URL.startsWith("__");
                  }

                  @JavascriptInterface
                  public String sinfo() {
                      return Sync.info(MainActivity.this);
                  }

                  @JavascriptInterface
                  public void copy(final String t) {
                      runOnUiThread(() -> {
                          final ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          ClipData d = ClipData.newPlainText("v", t);
                          if (Build.VERSION.SDK_INT >= 33) {
                              PersistableBundle pb = new PersistableBundle();
                              pb.putBoolean("android.content.extra.IS_SENSITIVE", true);
                              d.getDescription().setExtras(pb);
                          }
                          cm.setPrimaryClip(d);
                          h.removeCallbacksAndMessages(null);
                          h.postDelayed(() -> cm.clearPrimaryClip(), 30000);
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
                  w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS);
                  w.setBackgroundColor(0xFF0E1620);
                  w.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int rq, int rs, Intent d) {
                  super.onActivityResult(rq, rs, d);
                  busy = false;
                  if (rs != RESULT_OK || d == null || d.getData() == null) return;
                  final Uri u = d.getData();
                  try {
                      if (rq == 1) {
                          try {
                              getContentResolver().takePersistableUriPermission(u,
                                      Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                          } catch (Exception e) {
                          }
                          Backup.p(this).edit().putString("doc", u.toString()).apply();
                          new Thread(() -> {
                              Backup.run(MainActivity.this);
                              runOnUiThread(() -> js("bk()"));
                          }).start();
                      } else if (rq == 2) {
                          InputStream in = getContentResolver().openInputStream(u);
                          ByteArrayOutputStream o = new ByteArrayOutputStream();
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
                          in.close();
                          byte[] b = o.toByteArray();
                          if (b.length < 29 || Vault.file(this).exists()) throw new Exception("bad");
                          File tmp = new File(getFilesDir(), "vault.tmp");
                          FileOutputStream fo = new FileOutputStream(tmp);
                          fo.write(b);
                          fo.close();
                          tmp.renameTo(Vault.file(this));
                          js("showLock();toast('Sauvegarde restaurée : entre tes identifiants')");
                      }
                  } catch (Exception e) {
                      js("toast('Échec')");
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (!busy) {
                      Vault.lock();
                      js("lockUI()");
                  }
              }

              @Override
              public void onBackPressed() {
                  w.evaluateJavascript("back()", v -> {
                      if (!"true".equals(v)) finish();
                  });
              }
          }
          EOF_3
          cat > app/src/main/java/com/coffre/app/Vault.java <<'EOF_4'
          package com.coffre.app;

          import android.content.Context;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.file.Files;
          import java.security.SecureRandom;
          import java.text.Normalizer;
          import java.util.Arrays;
          import javax.crypto.Cipher;
          import javax.crypto.SecretKeyFactory;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.crypto.spec.PBEKeySpec;
          import javax.crypto.spec.SecretKeySpec;

          public class Vault {
              static SecretKeySpec key;
              static byte[] salt;
              static String q = "";
              static String json;
              static boolean gate;
              static boolean legacy;

              static File file(Context c) {
                  return new File(c.getFilesDir(), "vault.bin");
              }

              static String norm(String a) {
                  String s = Normalizer.normalize(a == null ? "" : a, Normalizer.Form.NFD);
                  return s.replaceAll("\\p{M}", "").toLowerCase().replaceAll("\\s+", " ").trim();
              }

              static SecretKeySpec derive(String pin, String ans, byte[] s) throws Exception {
                  String secret = ans == null ? pin : pin.length() + ":" + pin + "|" + norm(ans);
                  SecretKeyFactory f = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256");
                  byte[] k = f.generateSecret(new PBEKeySpec(secret.toCharArray(), s, 310000, 256)).getEncoded();
                  return new SecretKeySpec(k, "AES");
              }

              static boolean v2(byte[] b) {
                  return b.length > 5 && b[0] == 'C' && b[1] == 'V' && b[2] == '2';
              }

              static String question(Context c) {
                  try {
                      byte[] b = Files.readAllBytes(file(c).toPath());
                      if (v2(b)) {
                          int n = ((b[3] & 255) << 8) | (b[4] & 255);
                          return new String(b, 5, n, "UTF-8");
                      }
                  } catch (Exception e) {
                  }
                  return "";
              }

              static void write(Context c) throws Exception {
                  byte[] iv = new byte[12];
                  new SecureRandom().nextBytes(iv);
                  Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                  ci.init(Cipher.ENCRYPT_MODE, key, new GCMParameterSpec(128, iv));
                  byte[] ct = ci.doFinal(json.getBytes("UTF-8"));
                  byte[] qb = q.getBytes("UTF-8");
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  o.write('C');
                  o.write('V');
                  o.write('2');
                  o.write(qb.length >> 8);
                  o.write(qb.length & 255);
                  o.write(qb);
                  o.write(salt);
                  o.write(iv);
                  o.write(ct);
                  File tmp = new File(c.getFilesDir(), "vault.tmp");
                  FileOutputStream fo = new FileOutputStream(tmp);
                  fo.write(o.toByteArray());
                  fo.getFD().sync();
                  fo.close();
                  if (!tmp.renameTo(file(c))) throw new Exception("rename");
              }

              static void open(Context c, String pin, String ans) throws Exception {
                  byte[] b = Files.readAllBytes(file(c).toPath());
                  boolean is2 = v2(b);
                  int off = 0;
                  String qq = "";
                  if (is2) {
                      int n = ((b[3] & 255) << 8) | (b[4] & 255);
                      qq = new String(b, 5, n, "UTF-8");
                      off = 5 + n;
                  }
                  byte[] s = Arrays.copyOfRange(b, off, off + 16);
                  byte[] iv = Arrays.copyOfRange(b, off + 16, off + 28);
                  byte[] ct = Arrays.copyOfRange(b, off + 28, b.length);
                  SecretKeySpec k = derive(pin, is2 ? ans : null, s);
                  Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                  ci.init(Cipher.DECRYPT_MODE, k, new GCMParameterSpec(128, iv));
                  String j = new String(ci.doFinal(ct), "UTF-8");
                  key = k;
                  salt = s;
                  q = qq;
                  json = j;
                  legacy = !is2;
              }

              static void lock() {
                  key = null;
                  json = null;
                  gate = false;
                  legacy = false;
              }
          }
          EOF_4
          cat > app/src/main/java/com/coffre/app/Backup.java <<'EOF_5'
          package com.coffre.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.OpenableColumns;
          import java.io.OutputStream;
          import java.nio.file.Files;

          public class Backup {
              static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("b", 0);
              }

              static String dev() {
                  return (Build.MANUFACTURER + " " + Build.MODEL).trim();
              }

              static String fname() {
                  return "coffre-" + dev().replaceAll("[^A-Za-z0-9]+", "-") + ".bin";
              }

              static String name(Context c, Uri u) {
                  try (Cursor q = c.getContentResolver().query(u, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null)) {
                      if (q != null && q.moveToFirst()) return q.getString(0);
                  } catch (Exception e) {
                  }
                  return "fichier choisi";
              }

              static String info(Context c) {
                  SharedPreferences s = p(c);
                  String d = s.getString("doc", null);
                  String f = d == null ? "" : name(c, Uri.parse(d));
                  return "{\"d\":\"" + dev().replace("\"", "") + "\",\"f\":\"" + f.replace("\\", "").replace("\"", "")
                          + "\",\"t\":" + s.getLong("t", 0) + "}";
              }

              static boolean run(Context c) {
                  try {
                      String d = p(c).getString("doc", null);
                      if (d == null) return false;
                      byte[] b = Files.readAllBytes(Vault.file(c).toPath());
                      Uri u = Uri.parse(d);
                      OutputStream o;
                      try {
                          o = c.getContentResolver().openOutputStream(u, "wt");
                      } catch (Exception e) {
                          o = c.getContentResolver().openOutputStream(u, "w");
                      }
                      o.write(b);
                      o.close();
                      p(c).edit().putLong("t", System.currentTimeMillis()).apply();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
          EOF_5
          cat > app/src/main/java/com/coffre/app/Sync.java <<'EOF_6'
          package com.coffre.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.util.Base64;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.file.Files;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Sync {
              static final String SB_URL = "https://vklcgzwzxbwpjleepsdy.supabase.co";
              static final String SB_KEY = "sb_publishable_o-DQCrukTQW6H55usOIJyQ_Qy7R9l2z";

              static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("s", 0);
              }

              static void st(Context c, String s) {
                  p(c).edit().putString("st", s).apply();
              }

              static String[] http(String method, String path, String bearer, String body) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(SB_URL + path).openConnection();
                  c.setRequestMethod(method);
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(30000);
                  c.setRequestProperty("apikey", SB_KEY);
                  if (bearer != null) c.setRequestProperty("Authorization", "Bearer " + bearer);
                  c.setRequestProperty("Content-Type", "application/json");
                  if (body != null) {
                      c.setDoOutput(true);
                      OutputStream o = c.getOutputStream();
                      o.write(body.getBytes("UTF-8"));
                      o.close();
                  }
                  int code = c.getResponseCode();
                  InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  if (in != null) {
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                      in.close();
                  }
                  return new String[]{String.valueOf(code), bo.toString("UTF-8")};
              }

              static void save(Context c, JSONObject j, String email) throws Exception {
                  SharedPreferences.Editor e = p(c).edit();
                  e.putString("at", j.getString("access_token"));
                  e.putString("rt", j.getString("refresh_token"));
                  e.putLong("exp", System.currentTimeMillis() / 1000 + j.optLong("expires_in", 3600));
                  if (email != null) e.putString("em", email);
                  e.apply();
              }

              static String login(Context c, String mode, String email, String pw) {
                  if (SB_URL.startsWith("__")) return "ERR:Serveur non configuré";
                  try {
                      JSONObject b = new JSONObject().put("email", email).put("password", pw);
                      String path = mode.equals("up") ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
                      String[] r = http("POST", path, null, b.toString());
                      JSONObject j = new JSONObject(r[1]);
                      if (!j.has("access_token")) {
                          if (r[0].startsWith("2")) return "ERR:Confirmation d'e-mail activée dans Supabase : désactive-la";
                          return "ERR:" + j.optString("msg", j.optString("error_description", j.optString("message", "Échec")));
                      }
                      p(c).edit().clear().apply();
                      save(c, j, email);
                      return "OK";
                  } catch (Exception e) {
                      return "ERR:Réseau indisponible";
                  }
              }

              static String token(Context c) {
                  SharedPreferences s = p(c);
                  String at = s.getString("at", null);
                  if (at == null) return null;
                  if (s.getLong("exp", 0) > System.currentTimeMillis() / 1000 + 60) return at;
                  try {
                      JSONObject b = new JSONObject().put("refresh_token", s.getString("rt", ""));
                      String[] r = http("POST", "/auth/v1/token?grant_type=refresh_token", null, b.toString());
                      JSONObject j = new JSONObject(r[1]);
                      if (!j.has("access_token")) return null;
                      save(c, j, null);
                      return j.getString("access_token");
                  } catch (Exception e) {
                      return null;
                  }
              }

              static synchronized String push(Context c, boolean force) {
                  try {
                      String t = token(c);
                      if (t == null) return "ERR:Non connecté, reconnecte-toi";
                      int prev = p(c).getInt("rev", 0);
                      if (force) {
                          String[] g = http("GET", "/rest/v1/vaults?select=rev", t, null);
                          JSONArray a = new JSONArray(g[1]);
                          prev = a.length() == 0 ? 0 : a.getJSONObject(0).getInt("rev");
                      }
                      byte[] b = Files.readAllBytes(Vault.file(c).toPath());
                      JSONObject body = new JSONObject()
                              .put("p_blob", Base64.encodeToString(b, Base64.NO_WRAP))
                              .put("p_prev", prev);
                      String[] r = http("POST", "/rest/v1/rpc/push_vault", t, body.toString());
                      if (!r[0].startsWith("2")) return "ERR:Serveur " + r[0];
                      int n = Integer.parseInt(r[1].trim());
                      if (n < 0) {
                          st(c, "conflit");
                          return "CONFLICT";
                      }
                      p(c).edit().putInt("rev", n).putLong("ok", System.currentTimeMillis()).putString("st", "ok").apply();
                      return "OK";
                  } catch (Exception e) {
                      st(c, "off");
                      return "ERR:Réseau indisponible";
                  }
              }

              static synchronized String pull(Context c, boolean force) {
                  try {
                      String t = token(c);
                      if (t == null) return "ERR:Non connecté, reconnecte-toi";
                      if (!force && Vault.file(c).exists()) return "ERR:Un coffre existe déjà sur ce téléphone";
