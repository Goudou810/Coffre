name: Construire le Coffre
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Cle de signature
        run: |
          if [ ! -f coffre.keystore ]; then
            keytool -genkeypair -keystore coffre.keystore -storepass coffre-ks-2026 -keypass coffre-ks-2026 -alias coffre -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Coffre"
            git config user.name bot
            git config user.email bot@users.noreply.github.com
            git add coffre.keystore
            git commit -m "Cle de signature"
            git push
          fi
      - name: Ecrire le projet
        run: |
          mkdir -p app/src/main/java/com/coffre/app app/src/main/assets app/src/main/res/drawable app/src/main/res/mipmap-anydpi
          cat > settings.gradle <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Coffre'
          include ':app'
          EOF_0
          cat > app/build.gradle <<'EOF_1'
          plugins { id 'com.android.application' version '8.5.2' }

          android {
              namespace 'com.coffre.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.coffre.app'
                  minSdk 26
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
                  versionName '1.5'
              }
              signingConfigs {
                  main {
                      storeFile file("$rootDir/coffre.keystore")
                      storePassword 'coffre-ks-2026'
                      keyAlias 'coffre'
                      keyPassword 'coffre-ks-2026'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.main }
              }
          }
          EOF_1
          cat > app/src/main/AndroidManifest.xml <<'EOF_2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Coffre"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_2
          cat > app/src/main/java/com/coffre/app/MainActivity.java <<'EOF_3'
          package com.coffre.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PersistableBundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import java.security.SecureRandom;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              WebView w;
              Handler h = new Handler(Looper.getMainLooper());

              void js(final String s) {
                  runOnUiThread(() -> w.evaluateJavascript(s, null));
              }

              void done(String op, String r) {
                  js("sdone('" + op + "'," + JSONObject.quote(r) + ")");
              }

              public class Bridge {
                  @JavascriptInterface
                  public boolean has() {
                      return Vault.file(MainActivity.this).exists();
                  }

                  @JavascriptInterface
                  public String question() {
                      return Vault.question(MainActivity.this);
                  }

                  @JavascriptInterface
                  public String unlock(String pin, String ans) {
                      try {
                          Vault.lock();
                          Vault.open(MainActivity.this, pin, ans);
                          Vault.pin = pin;
                          return Vault.legacy ? "LEG" : "OK";
                      } catch (Exception e) {
                          Vault.lock();
                          return "ERR";
                      }
                  }

                  @JavascriptInterface
                  public String data() {
                      return Vault.json != null ? Vault.json : "ERR";
                  }

                  @JavascriptInterface
                  public boolean setup(String pin, String q, String ans) {
                      try {
                          boolean exists = Vault.file(MainActivity.this).exists();
                          if (exists && !Vault.legacy) return false;
                          String j = exists ? Vault.json : "{\"e\":[]}";
                          byte[] s = new byte[16];
                          new SecureRandom().nextBytes(s);
                          Vault.salt = s;
                          Vault.q = q;
                          Vault.json = j;
                          Vault.key = Vault.derive(pin, ans, s);
                          Vault.write(MainActivity.this);
                          Vault.legacy = false;
                          Vault.pin = pin;
                          Sync.auto(MainActivity.this);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean save(String j) {
                      try {
                          if (Vault.key == null || Vault.legacy) return false;
                          Vault.json = j;
                          Vault.write(MainActivity.this);
                          Sync.auto(MainActivity.this);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void lock() {
                      Vault.lock();
                  }

                  @JavascriptInterface
                  public void acct(final String mode, final String email, final String pw) {
                      new Thread(() -> done("acct", Sync.login(MainActivity.this, mode, email.trim(), pw))).start();
                  }

                  @JavascriptInterface
                  public void acct2(final String mode, final String email) {
                      final String pin = Vault.pin;
                      new Thread(() -> {
                          if (pin == null) done("acct", "ERR:Déverrouille d'abord le coffre");
                          else done("acct", Sync.login(MainActivity.this, mode, email.trim(), pin));
                      }).start();
                  }

                  @JavascriptInterface
                  public void push(final boolean force) {
                      new Thread(() -> done("push", Sync.push(MainActivity.this, force))).start();
                  }

                  @JavascriptInterface
                  public void pull(final boolean force) {
                      new Thread(() -> done("pull", Sync.pull(MainActivity.this, force))).start();
                  }

                  @JavascriptInterface
                  public void vstat() {
                      new Thread(() -> done("vstat", Sync.verified(MainActivity.this))).start();
                  }

                  @JavascriptInterface
                  public void resend() {
                      new Thread(() -> done("resend", Sync.sendVerify(MainActivity.this))).start();
                  }

                  @JavascriptInterface
                  public String logout() {
                      return Sync.logout(MainActivity.this);
                  }

                  @JavascriptInterface
                  public String sinfo() {
                      return Sync.info(MainActivity.this);
                  }

                  @JavascriptInterface
                  public void copy(final String t) {
                      runOnUiThread(() -> {
                          final ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          ClipData d = ClipData.newPlainText("v", t);
                          if (Build.VERSION.SDK_INT >= 33) {
                              PersistableBundle pb = new PersistableBundle();
                              pb.putBoolean("android.content.extra.IS_SENSITIVE", true);
                              d.getDescription().setExtras(pb);
                          }
                          cm.setPrimaryClip(d);
                          h.removeCallbacksAndMessages(null);
                          h.postDelayed(() -> {
                              if (Build.VERSION.SDK_INT >= 28) cm.clearPrimaryClip();
                              else cm.setPrimaryClip(ClipData.newPlainText("", ""));
                          }, 30000);
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
                  w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS);
                  w.setBackgroundColor(0xFF0B1320);
                  w.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  Vault.lock();
                  js("lockUI()");
              }

              @Override
              public void onBackPressed() {
                  w.evaluateJavascript("back()", v -> {
                      if (!"true".equals(v)) finish();
                  });
              }
          }
          EOF_3
          cat > app/src/main/java/com/coffre/app/Vault.java <<'EOF_4'
          package com.coffre.app;

          import android.content.Context;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.file.Files;
          import java.security.SecureRandom;
          import java.text.Normalizer;
          import java.util.Arrays;
          import javax.crypto.Cipher;
          import javax.crypto.SecretKeyFactory;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.crypto.spec.PBEKeySpec;
          import javax.crypto.spec.SecretKeySpec;

          public class Vault {
              static SecretKeySpec key;
              static byte[] salt;
              static String q = "";
              static String json;
              static String pin;
              static boolean legacy;

              static File file(Context c) {
                  return new File(c.getFilesDir(), "vault.bin");
              }

              static String norm(String a) {
                  String s = Normalizer.normalize(a == null ? "" : a, Normalizer.Form.NFD);
                  return s.replaceAll("\\p{M}", "").toLowerCase().replaceAll("\\s+", " ").trim();
              }

              static SecretKeySpec derive(String pin, String ans, byte[] s) throws Exception {
                  String secret = ans == null ? pin : pin.length() + ":" + pin + "|" + norm(ans);
                  SecretKeyFactory f = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256");
                  byte[] k = f.generateSecret(new PBEKeySpec(secret.toCharArray(), s, 310000, 256)).getEncoded();
                  return new SecretKeySpec(k, "AES");
              }

              static boolean v2(byte[] b) {
                  return b.length > 5 && b[0] == 'C' && b[1] == 'V' && b[2] == '2';
              }

              static String question(Context c) {
                  try {
                      byte[] b = Files.readAllBytes(file(c).toPath());
                      if (v2(b)) {
                          int n = ((b[3] & 255) << 8) | (b[4] & 255);
                          return new String(b, 5, n, "UTF-8");
                      }
                  } catch (Exception e) {
                  }
                  return "";
              }

              static void write(Context c) throws Exception {
                  byte[] iv = new byte[12];
                  new SecureRandom().nextBytes(iv);
                  Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                  ci.init(Cipher.ENCRYPT_MODE, key, new GCMParameterSpec(128, iv));
                  byte[] ct = ci.doFinal(json.getBytes("UTF-8"));
                  byte[] qb = q.getBytes("UTF-8");
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  o.write('C');
                  o.write('V');
                  o.write('2');
                  o.write(qb.length >> 8);
                  o.write(qb.length & 255);
                  o.write(qb);
                  o.write(salt);
                  o.write(iv);
                  o.write(ct);
                  File tmp = new File(c.getFilesDir(), "vault.tmp");
                  FileOutputStream fo = new FileOutputStream(tmp);
                  fo.write(o.toByteArray());
                  fo.getFD().sync();
                  fo.close();
                  if (!tmp.renameTo(file(c))) throw new Exception("rename");
              }

              static void open(Context c, String pin, String ans) throws Exception {
                  byte[] b = Files.readAllBytes(file(c).toPath());
                  boolean is2 = v2(b);
                  int off = 0;
                  String qq = "";
                  if (is2) {
                      int n = ((b[3] & 255) << 8) | (b[4] & 255);
                      qq = new String(b, 5, n, "UTF-8");
                      off = 5 + n;
                  }
                  byte[] s = Arrays.copyOfRange(b, off, off + 16);
                  byte[] iv = Arrays.copyOfRange(b, off + 16, off + 28);
                  byte[] ct = Arrays.copyOfRange(b, off + 28, b.length);
                  SecretKeySpec k = derive(pin, is2 ? ans : null, s);
                  Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                  ci.init(Cipher.DECRYPT_MODE, k, new GCMParameterSpec(128, iv));
                  String j = new String(ci.doFinal(ct), "UTF-8");
                  key = k;
                  salt = s;
                  q = qq;
                  json = j;
                  legacy = !is2;
              }

              static void lock() {
                  key = null;
                  json = null;
                  pin = null;
                  legacy = false;
              }
          }
          EOF_4
          cat > app/src/main/java/com/coffre/app/Sync.java <<'EOF_5'
          package com.coffre.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.util.Base64;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.file.Files;
          import javax.crypto.SecretKeyFactory;
          import javax.crypto.spec.PBEKeySpec;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Sync {
              static final String KEY = "AIzaSyDtFcETvYya_bIZnThFqPZm39Kvi5hLcx0";
              static final String PROJ = "goudou-9127b";
              static final String REF = "https://goudou-9127b.firebaseapp.com/";
              static final String DOC = "projects/" + PROJ + "/databases/(default)/documents";
              static final String API = "https://firestore.googleapis.com/v1/";

              static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("fb", 0);
              }

              static void st(Context c, String s) {
                  p(c).edit().putString("st", s).apply();
              }

              static long now() {
                  return System.currentTimeMillis() / 1000;
              }

              static String[] http(String method, String url, String bearer, String body, String ctype) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setRequestMethod(method);
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(30000);
                  c.setRequestProperty("Referer", REF);
                  c.setRequestProperty("Content-Type", ctype);
                  if (bearer != null) c.setRequestProperty("Authorization", "Bearer " + bearer);
                  if (body != null) {
                      c.setDoOutput(true);
                      OutputStream o = c.getOutputStream();
                      o.write(body.getBytes("UTF-8"));
                      o.close();
                  }
                  int code = c.getResponseCode();
                  InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  if (in != null) {
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                      in.close();
                  }
                  return new String[]{String.valueOf(code), bo.toString("UTF-8")};
              }

              static String authPw(String email, String pw) throws Exception {
                  SecretKeyFactory f = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256");
                  byte[] salt = ("coffre-auth|" + email.toLowerCase()).getBytes("UTF-8");
                  byte[] k = f.generateSecret(new PBEKeySpec(pw.toCharArray(), salt, 200000, 256)).getEncoded();
                  return Base64.encodeToString(k, Base64.NO_WRAP);
              }

              static String fr(String m) {
                  String k = m.split("[ :]")[0];
                  switch (k) {
                      case "EMAIL_EXISTS":
                          return "Cet e-mail a déjà un compte : connecte-toi.";
                      case "INVALID_LOGIN_CREDENTIALS":
                      case "INVALID_PASSWORD":
                      case "EMAIL_NOT_FOUND":
                          return "E-mail ou mot de passe incorrect.";
                      case "INVALID_EMAIL":
                          return "Adresse e-mail invalide.";
                      case "OPERATION_NOT_ALLOWED":
                          return "Active la connexion E-mail/Mot de passe dans Firebase (Authentication).";
                      case "TOO_MANY_ATTEMPTS_TRY_LATER":
                          return "Trop d'essais : réessaie dans quelques minutes.";
                      default:
                          return m.isEmpty() ? "Échec de la connexion" : m;
                  }
              }

              static String errMsg(String[] r) {
                  try {
                      JSONObject e = new JSONObject(r[1]).getJSONObject("error");
                      String m = e.optString("message", "");
                      String s = e.optString("status", "");
                      if (s.equals("PERMISSION_DENIED") || m.contains("insufficient permissions")) {
                          return "Accès refusé : publie les règles Firestore.";
                      }
                      if (m.contains("does not exist")) return "Firestore n'est pas créé : crée la base dans la console Firebase.";
                      if (m.contains("has not been used") || m.contains("disabled")) return "L'API Firestore n'est pas activée : crée la base Firestore.";
                      return m.isEmpty() ? "Serveur " + r[0] : m;
                  } catch (Exception x) {
                      return "Serveur " + r[0];
                  }
              }

              static String login(Context c, String mode, String email, String pw) {
                  try {
                      String url = "https://identitytoolkit.googleapis.com/v1/accounts:"
                              + (mode.equals("up") ? "signUp" : "signInWithPassword") + "?key=" + KEY;
                      JSONObject b = new JSONObject().put("email", email).put("password", authPw(email, pw))
                              .put("returnSecureToken", true);
                      String[] r = http("POST", url, null, b.toString(), "application/json");
                      JSONObject j = new JSONObject(r[1]);
                      if (!j.has("idToken")) {
                          JSONObject e = j.optJSONObject("error");
                          return "ERR:" + fr(e == null ? "" : e.optString("message", ""));
                      }
                      p(c).edit().clear()
                              .putString("at", j.getString("idToken"))
                              .putString("rt", j.getString("refreshToken"))
                              .putLong("exp", now() + Long.parseLong(j.optString("expiresIn", "3600")))
                              .putString("uid", j.getString("localId"))
                              .putString("em", email)
                              .apply();
                      if (mode.equals("up")) sendVerify(c);
                      return "OK";
                  } catch (Exception e) {
                      return "ERR:Réseau indisponible";
                  }
              }

              static String fail(Context c, String state, String detail) {
                  p(c).edit().putString("st", state).putString("le", detail).apply();
                  return "ERR:" + (state.equals("off") ? "Réseau indisponible" : detail);
              }

              static String sendVerify(Context c) {
                  try {
                      String t = token(c);
                      if (t == null) return "ERR:Non connecté";
                      JSONObject b = new JSONObject().put("requestType", "VERIFY_EMAIL").put("idToken", t);
                      String[] r = http("POST", "https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=" + KEY,
                              null, b.toString(), "application/json");
                      if (r[0].startsWith("2")) {
                          p(c).edit().putBoolean("vs", true).apply();
                          return "OK";
                      }
                      JSONObject e = new JSONObject(r[1]).optJSONObject("error");
                      return "ERR:" + fr(e == null ? "" : e.optString("message", ""));
                  } catch (Exception e) {
                      return "ERR:Réseau indisponible";
                  }
              }

              static String verified(Context c) {
                  try {
                      String t = token(c);
                      if (t == null) return "ERR";
                      String[] r = http("POST", "https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=" + KEY, null,
                              new JSONObject().put("idToken", t).toString(), "application/json");
                      if (!r[0].startsWith("2")) return "ERR";
                      boolean v = new JSONObject(r[1]).getJSONArray("users").getJSONObject(0).optBoolean("emailVerified", false);
                      return v ? "1" : "0";
                  } catch (Exception e) {
                      return "ERR";
                  }
              }

              static String token(Context c) {
                  SharedPreferences s = p(c);
                  String at = s.getString("at", null);
                  if (at == null) return null;
                  if (s.getLong("exp", 0) > now() + 60) return at;
                  try {
                      String body = "grant_type=refresh_token&refresh_token=" + URLEncoder.encode(s.getString("rt", ""), "UTF-8");
                      String[] r = http("POST", "https://securetoken.googleapis.com/v1/token?key=" + KEY, null, body,
                              "application/x-www-form-urlencoded");
                      JSONObject j = new JSONObject(r[1]);
                      if (!j.has("id_token")) return null;
                      p(c).edit().putString("at", j.getString("id_token")).putString("rt", j.getString("refresh_token"))
                              .putLong("exp", now() + Long.parseLong(j.optString("expires_in", "3600"))).apply();
                      return j.getString("id_token");
                  } catch (Exception e) {
                      return null;
                  }
              }

              static synchronized String push(Context c, boolean force) {
                  try {
                      String t = token(c);
                      String uid = p(c).getString("uid", null);
                      if (t == null || uid == null) return "ERR:Non connecté, reconnecte-toi";
                      byte[] b = Files.readAllBytes(Vault.file(c).toPath());
                      JSONObject up = new JSONObject();
                      up.put("name", DOC + "/vaults/" + uid);
                      up.put("fields", new JSONObject().put("blob",
                              new JSONObject().put("stringValue", Base64.encodeToString(b, Base64.NO_WRAP))));
                      JSONObject w = new JSONObject();
                      w.put("update", up);
                      w.put("updateMask", new JSONObject().put("fieldPaths", new JSONArray().put("blob")));
                      if (!force) {
                          String ut = p(c).getString("ut", null);
                          w.put("currentDocument", ut == null ? new JSONObject().put("exists", false)
                                  : new JSONObject().put("updateTime", ut));
                      }
                      JSONObject body = new JSONObject().put("writes", new JSONArray().put(w));
                      String[] r = http("POST", API + DOC + ":commit", t, body.toString(), "application/json");
                      if (r[0].startsWith("2")) {
                          String ut = new JSONObject(r[1]).getJSONArray("writeResults").getJSONObject(0).getString("updateTime");
                          p(c).edit().putString("ut", ut).putLong("ok", System.currentTimeMillis()).putString("st", "ok").apply();
                          return "OK";
                      }
                      if (r[0].equals("409") || r[1].contains("FAILED_PRECONDITION") || r[1].contains("ALREADY_EXISTS")
                              || r[1].contains("ABORTED")) {
                          st(c, "conflit");
                          return "CONFLICT";
                      }
                      return fail(c, "err", errMsg(r));
                  } catch (Exception e) {
                      return fail(c, "off", e.toString());
                  }
              }

              static synchronized String pull(Context c, boolean force) {
                  try {
                      String t = token(c);
                      String uid = p(c).getString("uid", null);
                      if (t == null || uid == null) return "ERR:Non connecté, reconnecte-toi";
                      if (!force && Vault.file(c).exists()) return "ERR:Un coffre existe déjà sur ce téléphone";
                      String[] r = http("GET", API + DOC + "/vaults/" + uid, t, null, "application/json");
                      if (r[0].equals("404")) return r[1].contains("does not exist") ? fail(c, "err", errMsg(r)) : "EMPTY";
                      if (!r[0].startsWith("2")) return fail(c, "err", errMsg(r));
                      JSONObject d = new JSONObject(r[1]);
                      String blob = d.getJSONObject("fields").getJSONObject("blob").getString("stringValue");
                      byte[] b = Base64.decode(blob, Base64.DEFAULT);
                      if (b.length < 29) return "ERR:Données invalides";
                      File tmp = new File(c.getFilesDir(), "vault.tmp");
                      FileOutputStream fo = new FileOutputStream(tmp);
                      fo.write(b);
                      fo.close();
                      if (!tmp.renameTo(Vault.file(c))) return "ERR:Écriture impossible";
                      p(c).edit().putString("ut", d.getString("updateTime"))
                              .putLong("ok", System.currentTimeMillis()).putString("st", "ok").apply();
                      return "OK";
                  } catch (Exception e) {
                      return "ERR:Réseau indisponible";
                  }
              }

              static void auto(final Context c) {
                  if (p(c).getString("at", null) == null) return;
                  new Thread(() -> push(c, false)).start();
              }

              static String logout(Context c) {
                  boolean linked = p(c).getString("at", null) != null;
                  if (linked && Vault.file(c).exists() && !"ok".equals(p(c).getString("st", ""))) {
                      return "ERR:Synchronise d'abord : des changements ne sont pas encore envoyés";
                  }
                  Vault.file(c).delete();
                  p(c).edit().clear().apply();
                  Vault.lock();
                  return "OK";
              }

              static String info(Context c) {
                  SharedPreferences s = p(c);
                  try {
                      String e = s.getString("at", null) == null ? "" : s.getString("em", "");
